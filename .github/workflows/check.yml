name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 */3 * *" # every 3 days — keeps the link-streak cache warm (7-day eviction)
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the tip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install -r tools/requirements-dev.txt
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -fsSL --max-time 60 -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL --max-time 60 -o /tmp/checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/checksums.txt"
          grep "gitleaks_8.30.1_linux_x64.tar.gz" /tmp/checksums.txt | (cd /tmp && sha256sum -c -)
          sudo tar -xzf /tmp/gl.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Restore link-warning streak state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tools/.link-state.json
          key: link-state-run-${{ github.run_id }}
          save-always: true
          restore-keys: |
            link-state-
        # NOTE: cache entries unused for 7 days are evicted; the schedule
        # runs every 3 days so the streak state stays warm.
      - name: Run site checker
        run: python tools/check_site.py --check-external

  deploy-boundary:
    # Post-deploy assertion: runs ONLY after a successful Pages deploy.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Assert deployed site serves pages, not repo docs
        run: |
          BASE="https://equationalapplications.github.io/company-in-a-box-tutorial"
          # Pages propagation can lag just after deploy — retry before failing
          code_index=""
          for i in 1 2 3 4 5 6; do
            code_index=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" "$BASE/index.html")
            [ "$code_index" = "200" ] && break
            echo "attempt $i: index=$code_index — waiting 15s for propagation"
            sleep 15
          done
          code_specs=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" "$BASE/specs/company-in-a-box-tutorial/spec.md")
          echo "index: $code_index (want 200) — specs: $code_specs (want 404)"
          [ "$code_index" = "200" ] || { echo "FAIL: site not published"; exit 1; }
          [ "$code_specs" = "404" ] || { echo "FAIL: repo docs leak through Pages"; exit 1; }
